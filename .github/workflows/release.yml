name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: riscv32imc-unknown-none-elf
          components: rust-src, llvm-tools

      - name: Build firmware
        working-directory: device/firmware
        run: cargo build --release

      - name: Prepare artifact
        run: |
          cp device/firmware/target/riscv32imc-unknown-none-elf/release/pointify-firmware pointify-firmware-riscv32.elf
          $(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-objcopy -O binary device/firmware/target/riscv32imc-unknown-none-elf/release/pointify-firmware pointify-firmware-riscv32.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pointify-firmware
          path: pointify-firmware-*

  pcb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad

      - name: Generate Gerber files
        run: |
          mkdir -p output/gerbers
          kicad-cli pcb export gerbers \
            --output output/gerbers/ \
            --layers F.Cu,B.Cu,F.Paste,B.Paste,F.SilkS,B.SilkS,F.Mask,B.Mask,Edge.Cuts \
            --no-x2 \
            --subtract-soldermask \
            --use-drill-file-origin \
            device/hardware/pointify.kicad_pcb

      - name: Generate Drill files
        run: |
          kicad-cli pcb export drill \
            --output output/gerbers/ \
            --format excellon \
            --excellon-units mm \
            --excellon-zeros-format decimal \
            --excellon-separate-th \
            --generate-map \
            --map-format gerberx2 \
            device/hardware/pointify.kicad_pcb

      - name: Create Gerber ZIP
        run: cd output/gerbers && zip -r ../pointify-gerbers.zip ./*

      - name: Generate BOM CSV
        run: |
          kicad-cli sch export bom \
            --output output/pointify-bom.csv \
            --fields 'Value,Reference,Footprint,LCSC' \
            --labels 'Comment,Designator,Footprint,LCSC' \
            --sort-field 'Reference' \
            --sort-asc \
            --exclude-dnp \
            device/hardware/pointify.kicad_sch

      - name: Generate CPL CSV
        run: |
          kicad-cli pcb export pos \
            --output output/pointify-cpl.csv \
            --format csv \
            --units mm \
            --side both \
            --exclude-dnp \
            --use-drill-file-origin \
            device/hardware/pointify.kicad_pcb
          sed -i '1s/Ref,Val,Package,PosX,PosY,Rot,Side/Designator,Val,Package,Mid X,Mid Y,Rotation,Layer/' output/pointify-cpl.csv

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pointify-pcb
          path: |
            output/pointify-gerbers.zip
            output/pointify-bom.csv
            output/pointify-cpl.csv

  housing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD Nightly
        run: |
          sudo snap install openscad-nightly

      - name: Generate STL files
        run: |
          models="1x2 1x3 1x4 1x5 1x6 1x7 2x2 2x3"
          mkdir -p output
          for model in $models; do
            rows=$(echo $model | cut -d'x' -f1)
            cols=$(echo $model | cut -d'x' -f2)
            output_file="output/pointify-3d-${model}.stl"
            echo "Generating ${output_file}..."
            openscad-nightly -o "${output_file}" -D "num_rows=${rows}" -D "num_cols=${cols}" device/3d/pointify.scad
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pointify-3d
          path: output/pointify-*.stl

  gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: aarch64
            runner: macos-latest
            rust-target: aarch64-apple-darwin
          - platform: macos
            arch: x86_64
            runner: macos-latest
            rust-target: x86_64-apple-darwin
          - platform: windows
            arch: x86_64
            runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
          - platform: linux
            arch: x86_64
            runner: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: gui
        run: npm install

      - name: Build Tauri app
        working-directory: gui
        run: npx tauri build --target ${{ matrix.rust-target }}

      - name: Rename artifacts (macOS)
        if: matrix.platform == 'macos'
        run: |
          mv gui/src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg/*.dmg pointify-macos-${{ matrix.arch }}.dmg

      - name: Rename artifacts (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Move-Item (Get-ChildItem gui/src-tauri/target/${{ matrix.rust-target }}/release/bundle/nsis/*.exe).FullName pointify-windows-${{ matrix.arch }}.exe

      - name: Rename artifacts (Linux)
        if: matrix.platform == 'linux'
        run: |
          mv gui/src-tauri/target/${{ matrix.rust-target }}/release/bundle/deb/*.deb pointify-linux-${{ matrix.arch }}.deb
          mv gui/src-tauri/target/${{ matrix.rust-target }}/release/bundle/appimage/*.AppImage pointify-linux-${{ matrix.arch }}.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pointify-${{ matrix.platform }}-${{ matrix.arch }}
          path: pointify-*

  release:
    needs: [firmware, pcb, housing, gui]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pointify-*
          generate_release_notes: true
