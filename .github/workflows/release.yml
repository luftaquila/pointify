name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - v2
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: riscv32imc-unknown-none-elf
          components: rust-src, llvm-tools

      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          workspaces: device/firmware -> target
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Build firmware
        if: github.ref != 'refs/heads/v2' || steps.cache.outputs.cache-hit != 'true'
        working-directory: device/firmware
        run: cargo build --release

      - name: Prepare artifact
        if: github.ref != 'refs/heads/v2' || steps.cache.outputs.cache-hit != 'true'
        run: |
          VERSION=$(python3 -c "
          import re
          with open('device/firmware/src/usb_cdc.rs') as f:
              text = f.read()
          m = re.search(r'(0x[0-9A-Fa-f]{2}),\s*(0x[0-9A-Fa-f]{2}),\s*//\s*bcdDevice', text)
          lo = int(m.group(1), 16)
          hi = int(m.group(2), 16)
          bcd = (hi << 8) | lo
          major = ((bcd >> 12) & 0xF) * 10 + ((bcd >> 8) & 0xF)
          minor = ((bcd >> 4) & 0xF) * 10 + (bcd & 0xF)
          print(f'v{major}.{minor}')
          ")
          cp device/firmware/target/riscv32imc-unknown-none-elf/release/pointify-firmware "pointify-firmware-${VERSION}.elf"

      - name: Upload artifacts
        if: github.ref != 'refs/heads/v2' || steps.cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pointify-firmware
          path: pointify-firmware-*.elf

  pcb:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull KiCad image
        run: docker pull kicad/kicad:9.0

      - name: Generate Gerber files
        run: |
          mkdir -p output/gerbers
          docker run --rm --user $(id -u):$(id -g) -v "$PWD:/work" -w /work kicad/kicad:9.0 \
            kicad-cli pcb export gerbers \
              --output output/gerbers/ \
              --layers F.Cu,B.Cu,F.Paste,B.Paste,F.SilkS,B.SilkS,F.Mask,B.Mask,Edge.Cuts \
              --no-x2 \
              --subtract-soldermask \
              --use-drill-file-origin \
              device/hardware/pointify.kicad_pcb

      - name: Generate Drill files
        run: |
          docker run --rm --user $(id -u):$(id -g) -v "$PWD:/work" -w /work kicad/kicad:9.0 \
            kicad-cli pcb export drill \
              --output output/gerbers/ \
              --format excellon \
              --excellon-units mm \
              --excellon-zeros-format decimal \
              --excellon-separate-th \
              --generate-map \
              --map-format gerberx2 \
              device/hardware/pointify.kicad_pcb

      - name: Create Gerber ZIP
        run: cd output/gerbers && zip -r ../pointify-gerbers.zip ./*

      - name: Generate BOM CSV
        run: |
          docker run --rm --user $(id -u):$(id -g) -v "$PWD:/work" -w /work kicad/kicad:9.0 \
            kicad-cli sch export bom \
              --output output/pointify-bom.csv \
              --fields 'Value,Reference,Footprint,LCSC' \
              --labels 'Comment,Designator,Footprint,LCSC' \
              --sort-field 'Reference' \
              --sort-asc \
              --exclude-dnp \
              device/hardware/pointify.kicad_sch

      - name: Generate CPL CSV
        run: |
          docker run --rm --user $(id -u):$(id -g) -v "$PWD:/work" -w /work kicad/kicad:9.0 \
            kicad-cli pcb export pos \
              --output output/pointify-cpl.csv \
              --format csv \
              --units mm \
              --side both \
              --exclude-dnp \
              --use-drill-file-origin \
              device/hardware/pointify.kicad_pcb
          sed -i '1s/Ref,Val,Package,PosX,PosY,Rot,Side/Designator,Val,Package,Mid X,Mid Y,Rotation,Layer/' output/pointify-cpl.csv

      - name: Create PCB ZIP
        run: cd output && zip ../pointify-pcb.zip pointify-gerbers.zip pointify-bom.csv pointify-cpl.csv

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pointify-pcb
          path: pointify-pcb.zip

  housing:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD Nightly
        run: |
          sudo snap install openscad-nightly

      - name: Generate STL files
        run: |
          models="1x2 1x3 1x4 1x5 1x6 1x7 2x2 2x3"
          mkdir -p output
          for model in $models; do
            rows=$(echo $model | cut -d'x' -f1)
            cols=$(echo $model | cut -d'x' -f2)
            output_file="output/pointify-3d-${model}.stl"
            echo "Generating ${output_file}..."
            openscad-nightly -o "${output_file}" -D "num_rows=${rows}" -D "num_cols=${cols}" device/3d/pointify.scad
          done

      - name: Create 3D ZIP
        run: cd output && zip ../pointify-3d.zip pointify-*.stl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pointify-3d
          path: pointify-3d.zip

  gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: aarch64
            runner: macos-latest
            rust-target: aarch64-apple-darwin
          - platform: macos
            arch: x86_64
            runner: macos-latest
            rust-target: x86_64-apple-darwin
          - platform: windows
            arch: x86_64
            runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
          - platform: windows
            arch: aarch64
            runner: windows-latest
            rust-target: aarch64-pc-windows-msvc
          - platform: linux
            arch: x86_64
            runner: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
          - platform: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          workspaces: gui/src-tauri -> target
          key: ${{ matrix.rust-target }}
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        if: github.ref != 'refs/heads/v2' || steps.cache.outputs.cache-hit != 'true'
        working-directory: gui
        run: npm install

      - name: Build Tauri app
        if: github.ref != 'refs/heads/v2' || steps.cache.outputs.cache-hit != 'true'
        working-directory: gui
        run: npx tauri build --target ${{ matrix.rust-target }}

      - name: Rename artifacts (macOS)
        if: matrix.platform == 'macos' && (github.ref != 'refs/heads/v2' || steps.cache.outputs.cache-hit != 'true')
        run: |
          mv gui/src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg/*.dmg pointify-macos-${{ matrix.arch }}.dmg

      - name: Rename artifacts (Windows)
        if: matrix.platform == 'windows' && (github.ref != 'refs/heads/v2' || steps.cache.outputs.cache-hit != 'true')
        shell: pwsh
        run: |
          Move-Item (Get-ChildItem gui/src-tauri/target/${{ matrix.rust-target }}/release/bundle/nsis/*.exe).FullName pointify-windows-${{ matrix.arch }}.exe

      - name: Rename artifacts (Linux)
        if: matrix.platform == 'linux' && (github.ref != 'refs/heads/v2' || steps.cache.outputs.cache-hit != 'true')
        run: |
          mv gui/src-tauri/target/${{ matrix.rust-target }}/release/bundle/deb/*.deb pointify-linux-${{ matrix.arch }}.deb
          mv gui/src-tauri/target/${{ matrix.rust-target }}/release/bundle/appimage/*.AppImage pointify-linux-${{ matrix.arch }}.AppImage

      - name: Upload artifacts
        if: github.ref != 'refs/heads/v2' || steps.cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pointify-${{ matrix.platform }}-${{ matrix.arch }}
          path: pointify-*

  release:
    needs: [firmware, pcb, housing, gui]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Package hardware artifacts
        run: |
          mkdir -p pointify-hardware/pcb pointify-hardware/3d
          cd pointify-hardware/pcb && unzip ../../pointify-pcb.zip
          cd ../3d && unzip ../../pointify-3d.zip
          cp ../../device/3d/pointify.scad .
          cd ../.. && zip -r pointify-hardware.zip pointify-hardware/
          rm pointify-pcb.zip pointify-3d.zip

      - name: Generate AI changelog summary
        id: changelog
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${TAG}$" | tail -1)

          if [ "$PREV_TAG" = "$TAG" ] || [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%h %s" -50)
          else
            COMMITS=$(git log --pretty=format:"%h %s" "${PREV_TAG}..${TAG}")
          fi

          PROMPT="You are a changelog writer for an open-source project called Pointify (a retro analog gauge meter system for hardware monitoring). Given the following git commits, write a concise release changelog in markdown. Do not include an overall title. Use ### for category headings (e.g. Features, Fixes, Improvements). Use bullet points. Do not include commit hashes. Write in English. Only output the changelog, nothing else.

          Commits:
          ${COMMITS}"

          BODY=$(jq -n --arg prompt "$PROMPT" '{
            "contents": [{"parts": [{"text": $prompt}]}],
            "generationConfig": {"temperature": 0.3}
          }')

          RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          SUMMARY=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$SUMMARY" ]; then
            echo "AI summary generation failed, falling back to commit list"
            SUMMARY="$(echo "$COMMITS" | sed 's/^[a-f0-9]* /- /')"
          fi

          {
            echo "summary<<CHANGELOG_EOF"
            echo "## Changelogs"
            echo ""
            echo "$SUMMARY"
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            echo ""
            echo "---"
            echo ""
            echo "## Install"
            echo "### macOS (Homebrew)"
            echo '```bash'
            echo "brew tap luftaquila/pointify https://github.com/luftaquila/pointify"
            echo "brew install --cask pointify"
            echo '```'
            echo "### Linux (Linuxbrew)"
            echo '```bash'
            echo "brew tap luftaquila/pointify https://github.com/luftaquila/pointify"
            echo "brew install pointify"
            echo '```'
            echo "### Windows / Manual Install"
            echo "Download from the assets below."
            echo ""
            echo "> [!NOTE]"
            echo "> On macOS, the app is not code-signed. Remove the quarantine attribute after installation:"
            echo '> ```bash'
            echo "> xattr -dr com.apple.quarantine /Applications/Pointify.app"
            echo '> ```'
            echo ""
            echo "> [!NOTE]"
            echo "> On Linux, to use firmware update, set udev rules for the WCH bootloader USB device:"
            echo '> ```bash'
            echo "> # /etc/udev/rules.d/50-wchisp.rules"
            echo '> SUBSYSTEM=="usb", ATTRS{idVendor}=="4348", ATTRS{idProduct}=="55e0", MODE="0666"'
            echo '> ```'
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pointify-*
          body: ${{ steps.changelog.outputs.summary }}

      - name: Update Homebrew formula and cask
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          SHA_MAC_ARM=$(shasum -a 256 pointify-macos-aarch64.dmg | awk '{print $1}')
          SHA_MAC_X86=$(shasum -a 256 pointify-macos-x86_64.dmg | awk '{print $1}')
          SHA_LINUX_ARM=$(shasum -a 256 pointify-linux-aarch64.AppImage | awk '{print $1}')
          SHA_LINUX_X86=$(shasum -a 256 pointify-linux-x86_64.AppImage | awk '{print $1}')

          # Update Cask
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Casks/pointify.rb
          # arm sha256 is the first occurrence, intel is the second
          sed -i "0,/sha256 \".*\"/{s/sha256 \".*\"/sha256 \"${SHA_MAC_ARM}\"/}" Casks/pointify.rb
          sed -i "0,/sha256 \".*\"/! {0,/sha256 \".*\"/ s/sha256 \".*\"/sha256 \"${SHA_MAC_X86}\"/}" Casks/pointify.rb

          # Update Formula
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/pointify.rb
          sed -i "0,/sha256 \".*\"/{s/sha256 \".*\"/sha256 \"${SHA_LINUX_ARM}\"/}" Formula/pointify.rb
          sed -i "0,/sha256 \".*\"/! {0,/sha256 \".*\"/ s/sha256 \".*\"/sha256 \"${SHA_LINUX_X86}\"/}" Formula/pointify.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/pointify.rb Formula/pointify.rb
          git commit -m "brew: update to ${VERSION}"
          git push origin HEAD:v2
